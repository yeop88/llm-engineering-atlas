# Alembic config (keep this file ASCII-only: Alembic reads it with the OS locale encoding).
# The database URL comes from app.config (Settings.db_url / DATABASE_URL in .env).
#   new migration:  uv run python -m alembic revision --autogenerate -m "message"
#   apply:          uv run python -m alembic upgrade head   (also applied automatically on app start)
[alembic]
script_location = %(here)s/migrations
path_separator = os
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
