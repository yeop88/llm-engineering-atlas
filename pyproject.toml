[project]
name = "embedding-lab"
version = "0.1.0"
description = "오픈소스 임베딩 모델을 관리하고 테스트하는 FastAPI 웹 애플리케이션"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi[standard]>=0.143.3",
    "sentence-transformers[image]>=6.1.0",
    "transformers>=5.20.1",
    "torch>=2.14.1",
    # sentence-transformers 6.1 이 huggingface-hub<2.0 을 요구하므로 1.x 최신을 사용
    "huggingface-hub>=1.3.0,<2.0.0",
    "sqlalchemy>=2.1.5",
    "pydantic-settings>=2.16.0",
    "numpy>=2.5.4",
    "psutil>=7.2.2",
    "einops>=0.8.2",
    "peft>=0.21.2",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
