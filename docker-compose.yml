# 벡터 DB 실행용 compose 파일.
#   기본(Qdrant):     docker compose up -d
#   pgvector 추가:    docker compose --profile pgvector up -d
#   MariaDB 추가:     docker compose --profile mariadb up -d
#   모두:             docker compose --profile pgvector --profile mariadb up -d
#   앱까지 컨테이너로: docker compose --profile app up -d --build   (docs/guides/deploy.md)
# 앱을 로컬(uv run)로 돌릴 때는 .env 의 VECTOR_STORE / *_URL 과 포트를 맞춰 사용합니다.

services:
  app:
    build:
      context: .
      args:
        TORCH_EXTRA: ${TORCH_EXTRA:-cpu}
    profiles: ["app"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # 컨테이너 안에서는 localhost 가 아니라 서비스 이름으로 찾는다
      QDRANT_URL: http://qdrant:6333
      PGVECTOR_URL: ${PGVECTOR_URL_IN_DOCKER:-postgresql://embedding:embedding@pgvector:5432/embedding_lab}
      MARIADB_URL: ${MARIADB_URL_IN_DOCKER:-mysql://embedding:embedding@mariadb:3306/embedding_lab}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
      - hf_cache:/root/.cache/huggingface   # 내려받은 모델 — 이미지를 다시 만들어도 남게
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"   # REST / 대시보드 (http://localhost:6333/dashboard)
      - "${QDRANT_GRPC_PORT:-6334}:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  pgvector:
    image: pgvector/pgvector:0.8.7-pg18
    profiles: ["pgvector"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: embedding
      POSTGRES_PASSWORD: embedding
      POSTGRES_DB: embedding_lab
    ports:
      - "${PGVECTOR_PORT:-5433}:5432"   # 로컬 PostgreSQL(5432)과 겹치지 않게 5433
    volumes:
      - pg_data:/var/lib/postgresql

  mariadb:
    image: mariadb:13.0.2
    profiles: ["mariadb"]
    restart: unless-stopped
    environment:
      MARIADB_USER: embedding
      MARIADB_PASSWORD: embedding
      MARIADB_DATABASE: embedding_lab
      MARIADB_ROOT_PASSWORD: embedding-root
    ports:
      - "${MARIADB_PORT:-3307}:3306"   # 로컬 MySQL/MariaDB(3306)와 겹치지 않게 3307
    volumes:
      - mariadb_data:/var/lib/mysql

  # 지식 그래프의 Cypher 실행(Text2Cypher). 원본 그래프는 앱 DB 에 있고 화면의 'Neo4j 로 옮기기'로 복사한다. 5.26 은 LTS
  neo4j:
    image: neo4j:5.26.32-community
    profiles: ["neo4j"]
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/embedding-graph
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # 브라우저 콘솔
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # 앱 연결 (NEO4J_URL=bolt://localhost:7687)
    volumes:
      - neo4j_data:/data

  # 지식 그래프 Cypher 엔진 두 번째 선택지(GRAPH_ENGINE=falkordb). Redis 모듈 기반 OpenCypher — 가볍고, 읽기 전용 명령(GRAPH.RO_QUERY)이 있다
  falkordb:
    image: falkordb/falkordb:v4.22.0
    profiles: ["falkordb"]
    restart: unless-stopped
    ports:
      - "${FALKORDB_PORT:-6380}:6379"   # 로컬 Redis(6379)와 겹치지 않게 6380 (FALKORDB_URL=redis://localhost:6380)
    volumes:
      - falkordb_data:/var/lib/falkordb/data

volumes:
  app_data:
  hf_cache:
  qdrant_data:
  pg_data:
  mariadb_data:
  neo4j_data:
  falkordb_data:
