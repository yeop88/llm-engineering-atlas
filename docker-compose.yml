# 벡터 DB 실행용 compose 파일.
#   기본(Qdrant):     docker compose up -d
#   pgvector 추가:    docker compose --profile pgvector up -d
#   MariaDB 추가:     docker compose --profile mariadb up -d
#   모두:             docker compose --profile pgvector --profile mariadb up -d
#   앱까지 컨테이너로: docker compose --profile app up -d --build   (docs/guides/deploy.md)
# 앱을 로컬(uv run)로 돌릴 때는 .env 의 VECTOR_STORE / *_URL 과 포트를 맞춰 사용합니다.

services:
  app:
    build:
      context: .
      args:
        TORCH_EXTRA: ${TORCH_EXTRA:-cpu}
    profiles: ["app"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # 컨테이너 안에서는 localhost 가 아니라 서비스 이름으로 찾는다
      QDRANT_URL: http://qdrant:6333
      PGVECTOR_URL: ${PGVECTOR_URL_IN_DOCKER:-postgresql://embedding:embedding@pgvector:5432/embedding_lab}
      MARIADB_URL: ${MARIADB_URL_IN_DOCKER:-mysql://embedding:embedding@mariadb:3306/embedding_lab}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
      - hf_cache:/root/.cache/huggingface   # 내려받은 모델 — 이미지를 다시 만들어도 남게
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"   # REST / 대시보드 (http://localhost:6333/dashboard)
      - "${QDRANT_GRPC_PORT:-6334}:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  pgvector:
    image: pgvector/pgvector:0.8.7-pg18
    profiles: ["pgvector"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: embedding
      POSTGRES_PASSWORD: embedding
      POSTGRES_DB: embedding_lab
    ports:
      - "${PGVECTOR_PORT:-5433}:5432"   # 로컬 PostgreSQL(5432)과 겹치지 않게 5433
    volumes:
      - pg_data:/var/lib/postgresql

  mariadb:
    image: mariadb:13.0.2
    profiles: ["mariadb"]
    restart: unless-stopped
    environment:
      MARIADB_USER: embedding
      MARIADB_PASSWORD: embedding
      MARIADB_DATABASE: embedding_lab
      MARIADB_ROOT_PASSWORD: embedding-root
    ports:
      - "${MARIADB_PORT:-3307}:3306"   # 로컬 MySQL/MariaDB(3306)와 겹치지 않게 3307
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  app_data:
  hf_cache:
  qdrant_data:
  pg_data:
  mariadb_data:
